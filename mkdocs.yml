site_name: 珠宝入门：从宝石学原理到选购决策
site_description: 一本边学边记、力求正确的珠宝书——选购避坑 + 系统宝石学
site_url: https://h-jett.github.io/JewelryLearning/
repo_url: https://github.com/H-Jett/JewelryLearning
repo_name: H-Jett/JewelryLearning
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 书的内容全部在 docs/（MkDocs 默认文档目录）。GitHub 上照样能直接浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 第一部分 · 宝石学地基:
      - chapters/01-gemology/00-intro.md
      - 第 1 章 · 什么是宝石（定名规则）: chapters/01-gemology/01-what-is-gemstone.md
      - 第 2 章 · 晶体与结构: chapters/01-gemology/02-crystal-structure.md
      - 第 3 章 · 光学①：折射率与临界角: chapters/01-gemology/03-optics-refraction.md
  - 速查与资料:
      - 宝石物理常数速查表: reference/constants.md
      - 标准与文献索引: reference/standards.md
      - 权威图库索引: reference/gallery.md
  - 记录表:
      - forms/index.md
      - 宝石观察记录表: forms/stone-observation.md
      - 证书核对清单: forms/certificate-checklist.md
  - 术语表: glossary.md
  - 思考题参考答案:
      - 第 1 章: qa/01-what-is-gemstone-qa.md
      - 第 2 章: qa/02-crystal-structure-qa.md
      - 第 3 章: qa/03-optics-refraction-qa.md
